[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "aml-monitor"
version = "0.1.0"
description = "AML transaction monitoring rule engine"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "faker>=22.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["aml_monitor/tests.py"]
